<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奉贤校区风力感知地图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1d17'/%3E%3Cg fill='none' stroke='%23c33a2a' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M5 12h13a3.5 3.5 0 1 0-3.5-3.5'/%3E%3Cpath d='M5 19h17a3.5 3.5 0 1 1-3.5 3.5'/%3E%3Cpath d='M5 15.5h8'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --ink:#14231c;
    --paper:#f4f1e6;
    --paper-2:#efeadd;
    --line:rgba(20,35,28,.14);
    --accent:#c33a2a;
    --accent-2:#e2673f;
    --deep:#0e1d17;
    --fade:rgba(242,239,228,.58);
    --heat-lo:#f7e2c6;
    --heat-mid:#e8845b;
    --heat-hi:#c0392b;
    --heat-max:#8c1f14;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--deep);
    background-image:radial-gradient(rgba(244,241,230,.055) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1440px;margin:0 auto;padding:20px clamp(12px,2.6vw,30px) 26px}

  /* ===== 顶部 ===== */
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .mark{display:flex;align-items:center;gap:10px}
  .mark svg{width:26px;height:26px;flex:none}
  h1{font-size:clamp(19px,2vw,25px);font-weight:650;letter-spacing:.02em;margin:0;line-height:1.2}
  .sub{font-size:12.5px;line-height:1.6;color:var(--fade);border-left:1px solid rgba(244,241,230,.22);padding-left:12px;max-width:340px}
  .modes{margin-left:auto;display:inline-flex;border:1px solid rgba(244,241,230,.22);background:rgba(244,241,230,.05);border-radius:3px;overflow:hidden}
  .modes button{
    appearance:none;border:0;background:transparent;color:rgba(244,241,230,.72);
    font:inherit;font-size:13.5px;font-weight:550;padding:9px 15px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:background .18s,color .18s;
  }
  .modes button:hover{background:rgba(244,241,230,.09);color:var(--paper)}
  .modes button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
  .modes button svg{width:14px;height:14px}
  .modes button:focus-visible{outline:2px solid var(--accent-2);outline-offset:-2px}

  /* ===== 主体 ===== */
  .grid{display:grid;grid-template-columns:1fr 322px;gap:16px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}

  .stage{
    position:relative;background:#dfe5d6;border:1px solid rgba(244,241,230,.16);
    border-radius:5px;
  }
  @media (min-width:901px){
    .stage{max-width:calc((100vh - 210px) * 1.4007);margin:0 auto}
  }
  .stage img.base{display:block;width:100%;height:auto;border-radius:4px}

  .heat{position:absolute;inset:0;opacity:0;transition:opacity .38s ease;pointer-events:none;filter:saturate(1.4) contrast(1.04)}
  .heat.on{opacity:1}
  .heat canvas{display:block;width:100%;height:100%;border-radius:4px}

  .pins{position:absolute;inset:0}
  .pin{
    position:absolute;width:34px;height:34px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:var(--accent);color:#fff;border:2px solid rgba(255,255,255,.94);
    font:600 14px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-variant-numeric:tabular-nums;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 2px 5px rgba(12,26,19,.35);
    transition:transform .16s ease,box-shadow .16s ease,opacity .3s ease;
    padding:0;
  }
  .pin::before{content:"";position:absolute;inset:-8px;border-radius:50%}
  .pin:hover{transform:translate(-50%,-50%) scale(1.1)}
  .pin:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .pin.sel{box-shadow:0 0 0 6px rgba(195,58,42,.30),0 3px 8px rgba(12,26,19,.4);transform:translate(-50%,-50%) scale(1.06)}
  .heat.on .pin{opacity:.96}
  @media (max-width:600px){
    .pin{width:28px;height:28px;font-size:12.5px;border-width:1.5px}
  }

  .tag{
    position:absolute;transform:translate(-50%,-142%);
    background:var(--ink);color:var(--paper);font-size:11.5px;line-height:1.35;
    padding:5px 9px;border-radius:3px;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .15s ease;z-index:5;
  }
  .tag.show{opacity:1}
  .tag b{color:#f0b6a9;font-weight:600}

  .legend{
    position:absolute;left:10px;bottom:10px;background:rgba(250,248,240,.95);
    color:var(--ink);border:1px solid rgba(20,35,28,.18);border-radius:3px;
    padding:8px 10px 9px;font-size:11.5px;line-height:1.4;
    opacity:0;transform:translateY(4px);transition:opacity .3s ease,transform .3s ease;pointer-events:none;
  }
  .legend.on{opacity:1;transform:none}
  .legend .bar{height:8px;width:138px;margin:5px 0 3px;border-radius:2px;
    background:linear-gradient(90deg,var(--heat-lo),var(--heat-mid) 45%,var(--heat-hi) 78%,var(--heat-max))}
  .legend .ends{display:flex;justify-content:space-between;width:138px;font-size:10.5px;color:rgba(20,35,28,.6)}

  .hint{
    position:absolute;right:10px;top:10px;background:rgba(250,248,240,.94);color:rgba(20,35,28,.72);
    border:1px solid rgba(20,35,28,.14);border-radius:3px;padding:5px 9px;font-size:11.5px;
    transition:opacity .3s ease;
  }
  .heat.on ~ .hint{opacity:0}

  /* ===== 右栏 ===== */
  .board{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--paper);color:var(--ink);border-radius:4px;border:1px solid rgba(244,241,230,.1)}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;padding:13px 14px 9px}
  .card-h span{font-size:12px;color:rgba(20,35,28,.55)}
  .card-h h2{font-size:13px;font-weight:600;letter-spacing:.04em;margin:0}

  .rank{padding:0 6px 8px;margin:0;list-style:none;max-height:340px;overflow:auto}
  @media (max-width:900px){.rank{max-height:none}}
  .rank li button{
    width:100%;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:9px;
    background:none;border:0;border-bottom:1px solid rgba(20,35,28,.08);
    padding:5px 8px;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;
    border-radius:2px;transition:background .15s;
  }
  .rank li button:hover{background:rgba(20,35,28,.05)}
  .rank li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank li button.on{background:rgba(195,58,42,.1);box-shadow:inset 2px 0 0 var(--accent)}
  .rk{font-size:11.5px;color:rgba(20,35,28,.45);font-variant-numeric:tabular-nums}
  .nm{min-width:0}
  .nm i{display:block;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
  .nm em{display:block;font-style:normal;font-size:10.5px;line-height:1.3;color:rgba(195,58,42,.85);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}

  .detail{padding:14px;min-height:196px}
  .d-empty{color:rgba(20,35,28,.45);font-size:12.5px;line-height:1.7;padding:16px 0}
  .d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .d-rank{font-size:11.5px;letter-spacing:.08em;color:rgba(20,35,28,.55)}
  .d-score{font-size:36px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.01em;white-space:nowrap;flex:none}
  .d-score small{font-size:12px;font-weight:500;color:rgba(20,35,28,.5);margin-left:4px;letter-spacing:0}
  .d-nick{font-size:20px;font-weight:680;letter-spacing:.01em;margin:8px 0 2px;line-height:1.3}
  .d-name{font-size:12.5px;color:rgba(20,35,28,.58);margin:0;line-height:1.5}
  .d-feel{font-size:12.5px;line-height:1.7;color:rgba(20,35,28,.78);margin:9px 0 0;
          border-left:2px solid rgba(195,58,42,.55);padding-left:9px}
  .bar-wrap{margin:12px 0 8px}
  .bar-track{height:6px;background:rgba(20,35,28,.1);border-radius:3px;overflow:hidden;position:relative}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .35s cubic-bezier(.22,1,.36,1)}
  .bar-meta{display:flex;justify-content:space-between;font-size:11px;color:rgba(20,35,28,.5);margin-top:5px;font-variant-numeric:tabular-nums}
  .d-form{font-size:12px;line-height:1.6;color:rgba(20,35,28,.66);margin:7px 0 0}
  .d-form b{font-weight:600;color:rgba(20,35,28,.85);margin-right:5px}

  /* ===== 详情卡 ===== */
  #detailCard[hidden]{display:none!important}
  #detailCard{animation:cardIn .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .d-close{
    appearance:none;border:0;background:transparent;color:rgba(20,35,28,.5);
    font:inherit;font-size:11.5px;letter-spacing:.02em;cursor:pointer;
    padding:3px 5px;margin:-3px -4px 0 0;border-radius:2px;transition:background .15s,color .15s;
  }
  .d-close:hover{background:rgba(20,35,28,.07);color:var(--accent)}
  .d-close:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ===== 纸巾图标（A/B/C/D 四态） ===== */
  .tissue{position:relative;display:inline-block;width:50px;height:42px;flex:none;vertical-align:middle}
  .tissue::after{ /* 手指捏住的一角 */
    content:"";position:absolute;left:3px;top:17px;width:7px;height:7px;border-radius:50%;
    background:rgba(20,35,28,.55);
  }
  .tissue .tp{
    position:absolute;left:6px;top:13px;width:25px;height:15px;
    background:linear-gradient(160deg,#fff,#f6f2e6 55%,#e9e3d2);
    border:1px solid rgba(20,35,28,.5);border-radius:2px;
    transform-origin:0 50%;
    box-shadow:0 1px 3px rgba(20,35,28,.18);
  }
  .tissue .tp::after{ /* 纸的折痕 */
    content:"";position:absolute;left:60%;top:1px;bottom:1px;width:1px;background:rgba(20,35,28,.13);
  }
  .tissue .wl{
    position:absolute;left:-10px;height:1px;border-radius:1px;
    background:rgba(20,35,28,.36);
    animation:wl 1.7s ease-in-out infinite;
  }
  .tissue .wl.w1{top:14px;width:16px}
  .tissue .wl.w2{top:25px;width:12px;animation-delay:-.55s}
  @keyframes wl{0%,100%{transform:translateX(-4px);opacity:.14}50%{transform:translateX(4px);opacity:.72}}

  .g-A .tp{animation:flapA 1.05s ease-in-out infinite}
  .g-B .tp{animation:flapB 1.5s ease-in-out infinite}
  .g-C .tp{animation:flapC 2.2s ease-in-out infinite}
  .g-D .tp{animation:flapD 3.8s ease-in-out infinite;opacity:.92}
  @keyframes flapA{0%,100%{transform:rotate(2deg) skewY(1deg)}50%{transform:rotate(-13deg) skewY(-4deg)}}
  @keyframes flapB{0%,100%{transform:rotate(-22deg) skewY(-3deg)}50%{transform:rotate(-34deg) skewY(3deg)}}
  @keyframes flapC{0%,100%{transform:rotate(-52deg) skewY(2deg)}50%{transform:rotate(-60deg) skewY(-3deg)}}
  @keyframes flapD{0%,100%{transform:rotate(84deg)}50%{transform:rotate(89deg)}}
  .tissue.sm{width:40px;height:34px;transform:scale(.78);transform-origin:6px 20px}

  .pose{
    display:flex;align-items:center;gap:10px;margin:11px 0 2px;
    background:rgba(20,35,28,.045);border-radius:3px;padding:8px 10px;
  }
  .pose .pose-t{font-size:11.5px;line-height:1.5;color:rgba(20,35,28,.72)}
  .pose .pose-t b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;letter-spacing:.02em}

  /* ===== 彩蛋按钮 ===== */
  .egg-row{display:flex;justify-content:flex-end;margin-top:12px}
  .egg-lock{
    display:flex;align-items:center;gap:9px;width:100%;max-width:322px;
    padding:11px 2px;font-size:11.5px;color:rgba(244,241,230,.42);letter-spacing:.02em;
    transition:opacity .45s ease;
  }
  .egg-lock.out{opacity:0}
  .lock-dots{display:flex;gap:4px}
  .lock-dots i{width:6px;height:6px;border-radius:50%;background:rgba(244,241,230,.18);
               transition:background .2s ease,transform .2s ease}
  .lock-dots i.on{background:rgba(226,103,63,.9);transform:scale(1.18)}
  .lock-t b{font-weight:600;color:rgba(244,241,230,.66)}
  .egg-btn{
    width:100%;max-width:322px;appearance:none;cursor:pointer;font:inherit;text-align:left;
    background:rgba(244,241,230,.055);border:1px dashed rgba(244,241,230,.3);
    border-radius:4px;padding:11px 13px;color:var(--paper);
    display:flex;align-items:center;gap:10px;
    transition:background .18s,border-color .18s,transform .18s;
  }
  .egg-btn:hover{background:rgba(244,241,230,.11);border-color:rgba(226,103,63,.7);transform:translateY(-1px)}
  .egg-btn[hidden]{display:none}
  .egg-btn.pop{animation:eggPop .6s cubic-bezier(.22,1,.36,1) both}
  @keyframes eggPop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .egg-btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .egg-btn .egg-ico{
    width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;
    background:rgba(226,103,63,.16);border:1px solid rgba(226,103,63,.42);color:#f0b6a9;font-size:13px;
  }
  .egg-btn .egg-tx{font-size:13px;font-weight:600;letter-spacing:.02em}
  .egg-btn .egg-sub{display:block;font-size:11px;font-weight:400;color:var(--fade);margin-top:2px;letter-spacing:0}

  /* ===== 弹层 ===== */
  #egg{position:fixed;inset:0;z-index:40;display:none;place-items:center;padding:18px;
       background:rgba(6,14,10,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  #egg.on{display:grid}
  .sheet{
    width:min(350px,94vw);max-height:calc(100vh - 36px);overflow:auto;
    background:var(--paper);color:var(--ink);border-radius:5px;padding:18px 18px 16px;
    box-shadow:0 22px 60px rgba(0,0,0,.45);
    animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
  }
  .sheet-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
             font-size:11px;letter-spacing:.1em;color:rgba(20,35,28,.5)}
  .sheet-top button{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
                    font-size:11.5px;color:rgba(20,35,28,.5);padding:2px 4px;border-radius:2px;letter-spacing:0}
  .sheet-top button:hover{color:var(--accent)}
  .q-step{font-size:10.5px;letter-spacing:.12em;color:var(--accent);margin:16px 0 6px}
  .q-text{font-size:15.5px;font-weight:620;line-height:1.5;margin:0 0 12px}
  .q-opts{display:flex;flex-direction:column;gap:8px}
  .q-opts button{
    appearance:none;font:inherit;font-size:13px;line-height:1.5;text-align:left;cursor:pointer;
    background:#fff;border:1px solid rgba(20,35,28,.16);border-radius:3px;
    padding:10px 12px;color:var(--ink);
    transition:background .15s,border-color .15s,transform .15s;
  }
  .q-opts button:hover{background:#fdfbf3;border-color:var(--accent);transform:translateX(2px)}
  .q-opts button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .res-card{position:relative}
  .res-band{height:5px;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:2px;margin:-4px 0 14px}
  .res-name{font-size:26px;font-weight:700;line-height:1.2;margin:0;letter-spacing:.01em}
  .res-name::before{content:"「";color:var(--accent)}
  .res-name::after{content:"」";color:var(--accent)}
  .res-line{font-size:12.5px;line-height:1.75;color:rgba(20,35,28,.72);margin:9px 0 0}
  .res-pt{margin-top:13px;padding-top:11px;border-top:1px dashed rgba(20,35,28,.2);
          display:flex;align-items:center;gap:10px}
  .res-pt .rp-t{font-size:11.5px;line-height:1.5;color:rgba(20,35,28,.6)}
  .res-pt .rp-t b{display:block;font-size:13.5px;font-weight:640;color:var(--ink)}
  .res-pt .rp-s{margin-left:auto;font-size:17px;font-weight:660;color:var(--accent);font-variant-numeric:tabular-nums}
  .res-meta{display:flex;gap:8px;margin-top:12px}
  .res-meta span{flex:1;background:rgba(20,35,28,.05);border-radius:3px;padding:7px 8px;
                 font-size:10.5px;color:rgba(20,35,28,.55);line-height:1.4}
  .res-meta span b{display:block;font-size:16px;font-weight:650;color:var(--ink);
                   font-variant-numeric:tabular-nums;margin-bottom:1px}
  .res-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
            margin-top:14px;padding-top:10px;border-top:1px solid rgba(20,35,28,.12)}
  .res-foot .rf-sign{font-size:10.5px;line-height:1.4;color:rgba(20,35,28,.42)}
  .res-foot button{appearance:none;font:inherit;font-size:11.5px;cursor:pointer;
                   background:none;border:1px solid rgba(20,35,28,.2);border-radius:3px;
                   padding:5px 9px;color:rgba(20,35,28,.7)}
  .res-foot button:hover{border-color:var(--accent);color:var(--accent)}

  /* ===== 分级卡 ===== */
  .grade-list{padding:0 14px 12px;margin:0;list-style:none}
  .grade-list li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(20,35,28,.07)}
  .grade-list li:last-child{border-bottom:0}
  .grade-list .gl-l{font-size:12.5px;font-weight:640;width:26px;flex:none;color:var(--accent)}
  .grade-list .gl-t{font-size:11.5px;line-height:1.45;color:rgba(20,35,28,.66)}

  /* ===== 页脚 ===== */
  .foot{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:rgba(244,241,230,.5);line-height:1.6}
  .foot b{font-weight:600;color:rgba(244,241,230,.72)}

  /* ===== 手机端：详情卡改为底部抽屉 ===== */
  #scrim{display:none}
  @media (max-width:900px){
    .stage{max-width:none;margin:0}
    .grid{gap:10px}
    #detailCard{
      position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;
      border-radius:13px 13px 0 0;border:0;
      box-shadow:0 -10px 34px rgba(4,12,8,.42);
      max-height:76vh;overflow:auto;
      padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
      animation:sheetUp .32s cubic-bezier(.22,1,.36,1) both;
    }
    #detailCard .card-h{padding-top:8px}
    #detailCard::before{
      content:"";display:block;width:38px;height:4px;border-radius:2px;
      background:rgba(20,35,28,.22);margin:6px auto 0;
    }
    @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
    #scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(6,14,10,.5);
           opacity:0;pointer-events:none;transition:opacity .28s ease}
    #scrim.on{opacity:1;pointer-events:auto}
    .egg-row{justify-content:stretch}
    .egg-lock,.egg-btn{max-width:none}
    .pin{width:32px;height:32px;font-size:13px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="#c33a2a" stroke-width="2.1" stroke-linecap="round">
        <path d="M5 11h13a3.4 3.4 0 1 0-3.4-3.4"/>
        <path d="M5 19.5h17a3.4 3.4 0 1 1-3.4 3.4"/>
        <path d="M5 15.2h8"/>
      </svg>
      <h1>奉贤校区风力感知地图</h1>
    </div>

        <div class="ends"><span>弱</span><span>强</span></div>
      </div>
    </section>

    <aside class="board">
      <div class="card" id="detailCard" hidden>
        <div class="card-h"><h2>点位详情</h2><button type="button" class="d-close" id="dClose">收起</button></div>
        <div class="detail" id="detail">
          <p class="d-empty">尚未选择点位。</p>
        </div>
      </div>


    </aside>
  </div>

  <div class="egg-row">
    <div class="egg-lock" id="eggLock">
      <span class="lock-dots" id="lockDots" aria-hidden="true"></span>
      <span class="lock-t">探索 <b id="lockN">0</b> / 8 · 看完全部点位解锁</span>
    </div>
    <button type="button" class="egg-btn" id="eggBtn" hidden>
      <span class="egg-ico" aria-hidden="true">?</span>
      <span>
        <span class="egg-tx">测你的避风体质</span>
        <span class="egg-sub">8 处已看完 · 3 道题，出一个本命风位</span>
      </span>
    </button>
  </div>

  <div class="foot">
    <div><b>数据</b>：项目组实地调研的 8 个点位综合得分，分数越高风感越强。</div>
    <div><b>底图</b>：奉贤校区平面示意图，仅示意位置，非精确测绘。</div>
  </div>
</div>

<div id="scrim"></div>

<div id="egg" role="dialog" aria-modal="true" aria-label="避风体质测试">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ===== 数据：位置为底图百分比坐标，得分为调研记录原值 ===== */
const GRADES = {
  A:{desc:"持续吹起，接近水平展开", label:"持续水平展开"},
  B:{desc:"明显飘扬，抖动频繁",     label:"明显飘扬"},
  C:{desc:"间歇扬起，以摆动为主",   label:"间歇摆动"},
  D:{desc:"几乎不飘动，仅边缘抖动", label:"几乎不动"}
};

const SPOTS = [
  {id:1, name:"图书馆",          nick:"吹风机本机",     grade:"A", score:6.46, x:52.0, y:49.9,
   note:"图文信息中心前广场",
   feel:"纸巾横着走，伞也横着走。",
   form:"体量较大的单体建筑，周边场地开阔，气流在建筑转角和迎风面一侧被压缩加速，是 8 处中风感最强的一处。"},
  {id:2, name:"实验一楼底部过道", nick:"天然加速管",     grade:"B", score:4.92, x:43.4, y:39.5,
   note:"中间狭长的过道",
   feel:"一条路把风捏成一股，走过去像被推着走。",
   form:"两侧实体墙面夹持的狭长通道，通道把气流收窄加速，狭管效应明显，纸巾持续被吹起。"},
  {id:3, name:"龙舟终点平地",     nick:"升旗级风力",     grade:"B", score:4.77, x:46.6, y:67.4,
   note:"升国旗的地方",
   feel:"没有墙挡，风就一路铺过来。",
   form:"无建筑遮挡的开阔硬质平地，来风不受阻碍，风力稳定但缺少通道的加速作用。"},
  {id:4, name:"一食堂门口",       nick:"饭点乱流区",     grade:"B", score:4.15, x:86.9, y:39.7,
   note:"食堂出入口前的空地",
   feel:"门一开一合，风跟着人一起进进出出。",
   form:"建筑出入口，门洞本身是气流出口，叠加人流扰动，风向变化频繁，纸巾频繁扬起。"},
  {id:5, name:"体育馆门口",       nick:"树荫漏风区",     grade:"C", score:3.15, x:79.1, y:73.5,
   note:"体育馆与体育场之间",
   feel:"树荫里是静音，跨出去两米就有声。",
   form:"前方连通操场，周边没有高大建筑，但分布树木植被，树冠削弱近地面气流，树荫内外风感差别明显。"},
  {id:6, name:"abcd 教",          nick:"楼间喘息区",     grade:"C", score:3.08, x:68.3, y:56.9,
   note:"教学 A/B/C/D 楼一带",
   feel:"风在楼缝里喘口气，断断续续。",
   form:"教学楼组团之间，建筑间距较小，气流被楼体分割、绕流后在通道内部分耗散。"},
  {id:7, name:"实验二楼附近",      nick:"背风静音区",     grade:"C", score:3.00, x:30.2, y:41.5,
   note:"实验楼群之间的通道",
   feel:"走两步才想起来今天有风。",
   form:"实验楼周边，建筑与树木遮挡较多，背风侧纸巾飘动幅度小、抖动缓慢。"},
  {id:8, name:"大学生活动中心",    nick:"被风原谅的广场", grade:"D", score:2.15, x:86.2, y:15.6,
   note:"活动中心建筑周边",
   feel:"风到这里就下班了。",
   form:"活动广场，周边有一定围合与绿化，气流到达地面时已被削减，风感最弱。"}
];

const MAX = Math.max(...SPOTS.map(s => s.score));
const MIN = Math.min(...SPOTS.map(s => s.score));
const AVG = SPOTS.reduce((a, s) => a + s.score, 0) / SPOTS.length;

const stage  = document.getElementById("stage");
const pinsEl = document.getElementById("pins");
const detail = document.getElementById("detail");
const heat   = document.getElementById("heat");
const canvas = document.getElementById("heatCanvas");
const legend = document.getElementById("legend");
const hint   = document.getElementById("hint");
const detailCard = document.getElementById("detailCard");
const scrim = document.getElementById("scrim");
const dClose = document.getElementById("dClose");

let selectedId = null;
let mode = "pin";

const ranked = SPOTS.slice().sort((a, b) => b.score - a.score);
const rankOf = id => ranked.findIndex(s => s.id === id) + 1;

/* ===== 纸巾四态图标 ===== */
function tissue(grade, size){
  const n = {A:2, B:2, C:1, D:0}[grade] || 0;
  let lines = "";
  for (let i = 0; i < n; i++) lines += '<span class="wl w' + (i + 1) + '"></span>';
  return '<span class="tissue g-' + grade + (size === "sm" ? ' sm' : '') + '" aria-hidden="true">' +
         '<span class="tp"></span>' + lines + '</span>';
}

/* ===== 地图标记 ===== */
const pinNodes = new Map();
const hasHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
SPOTS.forEach(s => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "pin";
  b.style.left = s.x + "%";
  b.style.top  = s.y + "%";
  b.textContent = s.id;
  b.setAttribute("aria-label", s.id + " " + s.name + "，外号" + s.nick + "，得分 " + s.score);
  b.addEventListener("click", () => select(s.id, true));
  if (hasHover) {
    b.addEventListener("mouseenter", () => showTag(s));
    b.addEventListener("mouseleave", () => { if (selectedId !== s.id) hideTag(); });
    b.addEventListener("focus", () => showTag(s));
    b.addEventListener("blur", () => { if (selectedId !== s.id) hideTag(); });
  }
  pinsEl.appendChild(b);
  pinNodes.set(s.id, b);
});

const tag = document.createElement("div");
tag.className = "tag";
pinsEl.appendChild(tag);
function showTag(s){
  tag.innerHTML = "<b>" + s.nick + "</b> · " + s.name + " · " + s.score.toFixed(2);
  tag.style.left = s.x + "%";
  tag.style.top  = s.y + "%";
  tag.classList.add("show");
}
function hideTag(){ tag.classList.remove("show"); }

/* ===== 选中与详情 ===== */
function select(id, focus){
  if (selectedId === id && !detailCard.hidden) { clearSelection(); return; }  /* 再点同一个编号则收起 */
  selectedId = id;
  detailCard.hidden = false;
  scrim.classList.add("on");
  pinNodes.forEach((el, k) => el.classList.toggle("sel", k === id));
  if (focus && pinNodes.has(id)) pinNodes.get(id).focus({preventScroll:true});
  const s = SPOTS.find(x => x.id === id);
  if (hasHover) showTag(s); else hideTag();
  renderDetail(s);
  markVisited(id);
}

function renderDetail(s){
  const pct = Math.max(6, ((s.score - MIN) / (MAX - MIN)) * 100);
  const dAvg = s.score - AVG;
  const devTxt = (dAvg >= 0 ? "高于" : "低于") + " 8 点均值 " + Math.abs(dAvg).toFixed(2);
  detail.innerHTML =
    '<div class="d-head">' +
      '<div style="min-width:0">' +
        '<div class="d-rank">排名 ' + rankOf(s.id) + ' / 8</div>' +
        '<div class="d-nick">' + s.nick + '</div>' +
        '<div class="d-name">' + s.name + ' · ' + s.note + '</div>' +
      '</div>' +
      '<div class="d-score">' + s.score.toFixed(2) + '<small>分</small></div>' +
    '</div>' +
    '<div class="pose">' + tissue(s.grade) +
      '<span class="pose-t"><b>纸巾姿态 ' + s.grade + ' 级</b>' + GRADES[s.grade].desc + '</span>' +
    '</div>' +
    '<p class="d-feel">' + s.feel + '</p>' +
    '<p class="d-form"><b>场地特征</b>' + s.form + '</p>' +
    '<div class="bar-wrap">' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="bar-meta"><span>' + devTxt + '</span><span>区间 ' + MIN.toFixed(2) + '–' + MAX.toFixed(2) + '</span></div>' +
    '</div>' +
    '<div class="d-foot" style="font-size:11.5px;color:rgba(20,35,28,.55);border-top:1px solid rgba(20,35,28,.1);padding-top:9px;margin-top:6px;line-height:1.55">' +
      '外号取自现场观察，方便记住这处的风；得分为问卷汇总值，相邻点位差 0.1 以内可视为同一档。</div>';
}

function clearSelection(){
  if (selectedId === null) return;
  selectedId = null;
  detailCard.hidden = true;
  scrim.classList.remove("on");
  pinNodes.forEach(el => el.classList.remove("sel"));
  hideTag();
}
dClose.addEventListener("click", clearSelection);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { clearSelection(); closeEgg(); }
});

/* ===== 热力层 ===== */
function drawHeat(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  SPOTS.slice().sort((a, b) => a.score - b.score).forEach(s => {
    const t = (s.score - MIN) / (MAX - MIN);
    const cx = s.x / 100 * w, cy = s.y / 100 * h;
    const r  = (0.10 + 0.14 * t) * Math.max(w, h * 1.4);
    const a  = 0.26 + 0.6 * t;

    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0.00, "rgba(196,26,20," + (a).toFixed(3) + ")");
    g.addColorStop(0.22, "rgba(205,38,26," + (a * 0.86).toFixed(3) + ")");
    g.addColorStop(0.46, "rgba(216,66,38," + (a * 0.62).toFixed(3) + ")");
    g.addColorStop(0.70, "rgba(228,110,60," + (a * 0.34).toFixed(3) + ")");
    g.addColorStop(0.88, "rgba(238,150,96," + (a * 0.14).toFixed(3) + ")");
    g.addColorStop(1.00, "rgba(244,180,130,0)");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    if (t > 0.4) {
      [0.34, 0.58].forEach(k => {
        ctx.beginPath();
        ctx.arc(cx, cy, r * k, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(158,24,18," + (0.16 + 0.26 * t).toFixed(3) + ")";
        ctx.lineWidth = 1.3;
        ctx.stroke();
      });
    }
  });
}

/* ===== 视图切换 ===== */
function setMode(m){
  mode = m;
  const isHeat = m === "heat";
  heat.classList.toggle("on", isHeat);
  legend.classList.toggle("on", isHeat);
  hint.style.opacity = isHeat ? 0 : 1;
  document.getElementById("tab-pin").setAttribute("aria-selected", String(!isHeat));
  document.getElementById("tab-heat").setAttribute("aria-selected", String(isHeat));
  if (isHeat) drawHeat();
}
document.getElementById("tab-pin").addEventListener("click", () => setMode("pin"));
document.getElementById("tab-heat").addEventListener("click", () => setMode("heat"));

let raf = 0;
function scheduleDraw(){
  if (mode !== "heat") return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(drawHeat);
}
window.addEventListener("resize", scheduleDraw);
if (window.ResizeObserver) new ResizeObserver(scheduleDraw).observe(stage);
stage.querySelector("img").addEventListener("load", scheduleDraw);

stage.addEventListener("click", e => {
  if (!e.target.closest(".pin")) clearSelection();
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".pin") || t.closest("#detailCard") || t.closest(".modes") || t.closest(".egg-btn")) return;
  if (!t.closest("#stage")) clearSelection();
});

/* ===== 彩蛋解锁：八个点位全部点过才出现 ===== */
const visited = new Set();
const eggBtn = document.getElementById("eggBtn");
const eggLock = document.getElementById("eggLock");
const lockDots = document.getElementById("lockDots");
const lockN = document.getElementById("lockN");
for (let i = 0; i < SPOTS.length; i++) lockDots.appendChild(document.createElement("i"));

function markVisited(id){
  if (visited.has(id)) return;
  visited.add(id);
  const dots = lockDots.children;
  dots[id - 1] && dots[id - 1].classList.add("on");
  lockN.textContent = visited.size;
  if (visited.size === SPOTS.length && eggBtn.hidden){
    eggLock.classList.add("out");
    setTimeout(() => { eggLock.style.display = "none"; }, 450);
    eggBtn.hidden = false;
    eggBtn.classList.add("pop");
    eggBtn.focus({preventScroll:true});
  }
}

/* ===== 彩蛋：避风体质测试 ===== */
const PERSONAS = [
  {name:"人形风速仪", sens:98, res:55, spot:1,
   line:"风还没吹到脸上，你已经先眯眼了。全组唯一不用纸巾就能报风力的人。"},
  {name:"穿堂风选手", sens:70, res:88, spot:2,
   line:"你专挑最窄的那条路走，理由是近。风认得出你的脚步声。"},
  {name:"风中凌乱系", sens:85, res:62, spot:4,
   line:"刘海、外套、外卖袋，总有一个在飞。你和风天天见面，但互相不认识。"},
  {name:"背风隐士",   sens:20, res:99, spot:8,
   line:"风绕过你，就像绕过活动中心。不是不怕风，是根本没察觉。"}
];

const QUIZ = [
  {q:"冬天一阵风迎面吹来，你通常会：",
   o:[["把帽子围巾全套拉满，整个人缩起来",0],
      ["眯一下眼接着走，风不算什么",3],
      ["先把头发按住，再决定走不走",2]]},
  {q:"在校园里从 A 点到 B 点，你更常走哪条路：",
   o:[["楼缝里那条窄通道，因为近",1],
      ["贴着墙或树荫的一侧，稳一点",3],
      ["哪条有人走哪条",2]]},
  {q:"在你印象里，校园风最大的地方是：",
   o:[["图书馆前那片空地",0],
      ["实验一楼那条过道",1],
      ["说不上来，我很少觉得有风",3]]}
];

const egg = document.getElementById("egg");
const sheet = document.getElementById("sheet");
let step = 0, picks = [];

function openEgg(){
  step = 0; picks = [];
  renderQuiz();
  egg.classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeEgg(){
  egg.classList.remove("on");
  document.body.style.overflow = "";
}
function renderQuiz(){
  const q = QUIZ[step];
  sheet.innerHTML =
    '<div class="sheet-top"><span>避风体质测试</span><button type="button" id="eggX">关闭</button></div>' +
    '<div class="q-step">问题 ' + (step + 1) + ' / ' + QUIZ.length + '</div>' +
    '<p class="q-text">' + q.q + '</p>' +
    '<div class="q-opts">' +
      q.o.map((o, i) => '<button type="button" data-i="' + i + '">' + o[0] + '</button>').join("") +
    '</div>';
  document.getElementById("eggX").addEventListener("click", closeEgg);
  sheet.querySelectorAll(".q-opts button").forEach(b => {
    b.addEventListener("click", () => {
      picks.push(QUIZ[step].o[Number(b.dataset.i)][1]);
      step++;
      if (step < QUIZ.length) renderQuiz(); else renderResult();
    });
  });
}
function renderResult(){
  const tally = [0, 0, 0, 0];
  picks.forEach(p => tally[p]++);
  let best = 0;
  tally.forEach((v, i) => { if (v > tally[best]) best = i; });
  const p = PERSONAS[best];
  const s = SPOTS.find(x => x.id === p.spot);

  sheet.innerHTML =
    '<div class="sheet-top"><span>你的结果</span><button type="button" id="eggX">关闭</button></div>' +
    '<div class="res-card" style="margin-top:12px">' +
      '<div class="res-band"></div>' +
      '<h3 class="res-name">' + p.name + '</h3>' +
      '<p class="res-line">' + p.line + '</p>' +
      '<div class="res-pt">' + tissue(s.grade) +
        '<span class="rp-t">你的本命风位<b>' + s.nick + ' · ' + s.name + '</b></span>' +
        '<span class="rp-s">' + s.score.toFixed(2) + '</span>' +
      '</div>' +
      '<div class="res-meta">' +
        '<span><b>' + p.sens + '</b>风感敏感度</span>' +
        '<span><b>' + p.res + '</b>抗风值 / 100</span>' +
      '</div>' +
      '<div class="res-foot">' +
        '<span class="rf-sign">奉贤校区 · 风力感知地图<br>截图保存，欢迎对号入座</span>' +
        '<button type="button" id="eggAgain">再测一次</button>' +
      '</div>' +
    '</div>';
  document.getElementById("eggX").addEventListener("click", closeEgg);
  document.getElementById("eggAgain").addEventListener("click", () => { step = 0; picks = []; renderQuiz(); });
}
eggBtn.addEventListener("click", openEgg);
egg.addEventListener("click", e => { if (e.target === egg) closeEgg(); });
scrim.addEventListener("click", clearSelection);
</script>
</body>
</html>
